version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: travel_app
      POSTGRES_PASSWORD: travel_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  api:
    build:
      context: ./backend
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: travel_app
      DB_PASSWORD: travel_pass
      DB_NAME: travel_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: travel
      REDIS_DEFAULT_TTL: 300
      REDIS_TRIPS_TTL: 300
      REDIS_TRIP_TTL: 300
      REDIS_LOCATIONS_TTL: 300
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '4000:4000'
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./frontend
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      API_BASE_URL: http://api:4000
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - api

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  db_data:
