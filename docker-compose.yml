version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: travel_db
      POSTGRES_USER: travel_app
      POSTGRES_PASSWORD: travel_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  api:
    build:
      context: ./backend
    command: npm run dev
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: travel_app
      DB_PASSWORD: travel_pass
      DB_NAME: travel_db
    volumes:
      - ./backend:/usr/src/app
    ports:
      - '4000:4000'
    depends_on:
      - db

  web:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    volumes:
      - ./frontend:/usr/src/app
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  db_data:
